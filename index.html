<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테슬라 로드스터 장애물 피하기</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js (3D Graphics) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            user-select: none;
            overflow: hidden;
            background-color: #0b0f19;
            margin: 0;
            padding: 0;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .hit-flash {
            animation: flashRed 0.4s ease-out;
        }
        @keyframes flashRed {
            0% { background-color: rgba(239, 68, 68, 0.6); }
            100% { background-color: transparent; }
        }
    </style>
</head>
<body class="text-white relative">

    <!-- Red Damage Overlay -->
    <div id="damage-overlay" class="pointer-events-none absolute inset-0 z-30 transition-colors duration-200"></div>

    <!-- UI Overlay (HUD) -->
    <div id="hud" class="hidden absolute top-0 left-0 w-full p-4 md:p-6 z-20 flex justify-between items-start pointer-events-none">
        <!-- Hearts / Life (1 Life Mode) -->
        <div class="bg-gray-900/85 backdrop-blur border border-red-500/30 rounded-2xl px-5 py-3 flex items-center gap-2 shadow-lg shadow-red-500/10">
            <span class="text-xs font-bold text-gray-400 tracking-wider mr-2">LIFE</span>
            <div id="lives-container" class="flex gap-2 text-2xl">
                <span class="text-red-500 transition-transform duration-300">❤️</span>
            </div>
        </div>

        <!-- Score / Time -->
        <div class="bg-gray-900/85 backdrop-blur border border-cyan-500/30 rounded-2xl px-6 py-3 text-right shadow-lg shadow-cyan-500/10">
            <div class="text-xs font-bold text-gray-400 tracking-wider">TIME SURVIVED</div>
            <div class="text-3xl font-black font-orbitron text-cyan-400 tracking-wider" id="score-text">0.0s</div>
        </div>
    </div>

    <!-- Speedometer HUD (Bottom Right) -->
    <div id="speedometer-hud" class="hidden absolute bottom-24 right-6 z-20 bg-gray-900/85 backdrop-blur border border-yellow-500/40 rounded-2xl px-5 py-3 text-center shadow-lg shadow-yellow-500/10 pointer-events-none">
        <div class="text-[10px] font-bold text-gray-400 tracking-widest font-orbitron">SPEED</div>
        <div class="flex items-baseline justify-center gap-1">
            <span id="speed-text" class="text-3xl font-black font-orbitron text-yellow-400">120</span>
            <span class="text-xs font-bold text-gray-400 font-orbitron">KM/H</span>
        </div>
    </div>

    <!-- Touch Controls for Mobile & Tablet -->
    <div id="touch-controls" class="hidden absolute bottom-6 left-0 w-full z-20 px-6 flex justify-between items-center pointer-events-auto">
        <div class="flex gap-3">
            <button id="btn-left" class="w-16 h-16 bg-gray-900/90 active:bg-cyan-600 rounded-2xl border border-gray-600 flex items-center justify-center text-2xl font-bold shadow-lg text-cyan-400">◄</button>
            <button id="btn-right" class="w-16 h-16 bg-gray-900/90 active:bg-cyan-600 rounded-2xl border border-gray-600 flex items-center justify-center text-2xl font-bold shadow-lg text-cyan-400">►</button>
        </div>
        <div class="flex gap-2">
            <button id="btn-boost" class="w-20 h-16 bg-yellow-600/90 active:bg-yellow-500 rounded-2xl border border-yellow-400 font-bold font-orbitron text-xs shadow-lg text-yellow-100">BOOST</button>
            <button id="btn-jump" class="w-20 h-16 bg-red-600/90 active:bg-red-500 rounded-2xl border border-red-400 font-bold font-orbitron text-xs shadow-lg text-red-100">JUMP</button>
        </div>
    </div>

    <!-- Main Screen Modal (Start / Game Over) -->
    <div id="modal-container" class="absolute inset-0 z-40 bg-black/70 backdrop-blur-md flex items-center justify-center p-4">
        <!-- Start Screen -->
        <div id="start-screen" class="max-w-md w-full bg-gray-900/95 border border-cyan-500/40 rounded-3xl p-8 text-center shadow-2xl shadow-cyan-500/20">
            <div class="inline-block px-3 py-1 bg-red-500/20 border border-red-500/40 rounded-full text-red-400 text-xs font-bold tracking-widest mb-4">UNREAL SHADER 3D</div>
            <h1 class="text-3xl md:text-4xl font-black font-orbitron tracking-tight mb-3 text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-red-500">
                ROADSTER RUNNER
            </h1>
            <p class="text-gray-400 text-sm mb-6 leading-relaxed">
                언리얼 그래픽 감성의 5차선 도로에서 페라리와 장애물을 피하세요!<br>
                점프와 부스터로 하드코어 생존에 도전하세요.
            </p>

            <div class="bg-gray-800/80 rounded-2xl p-4 text-left text-xs text-gray-300 space-y-2 mb-6 border border-gray-700">
                <div class="flex justify-between items-center">
                    <span class="text-gray-400">좌우 이동</span>
                    <span class="font-bold text-cyan-400 font-orbitron">방향키 ← / →</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-gray-400">장애물 점프</span>
                    <span class="font-bold text-red-400 font-orbitron">SPACEBAR</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-gray-400">니트로 부스터</span>
                    <span class="font-bold text-yellow-400 font-orbitron">SHIFT (HOLD)</span>
                </div>
            </div>

            <button id="start-btn" class="w-full py-4 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 rounded-2xl font-bold font-orbitron text-lg tracking-wider transition-all duration-300 shadow-lg shadow-cyan-500/30 active:scale-95 text-white">
                START RACE
            </button>
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-screen" class="hidden max-w-md w-full bg-gray-900/95 border border-red-500/40 rounded-3xl p-8 text-center shadow-2xl shadow-red-500/20">
            <div class="text-4xl mb-2">💥</div>
            <h2 class="text-3xl font-black font-orbitron text-red-500 mb-2">GAME OVER</h2>
            <p class="text-gray-400 text-xs mb-6">충돌하여 생존에 실패했습니다!</p>

            <div class="bg-gray-800/80 rounded-2xl p-6 mb-6 border border-gray-700">
                <div class="text-xs font-bold text-gray-400 tracking-wider mb-1">FINAL RECORD</div>
                <div id="final-score" class="text-4xl font-black font-orbitron text-cyan-400">0.00초</div>
            </div>

            <button id="restart-btn" class="w-full py-4 bg-gradient-to-r from-red-600 to-red-500 hover:from-red-500 hover:to-red-400 rounded-2xl font-bold font-orbitron text-lg tracking-wider transition-all duration-300 shadow-lg shadow-red-500/30 active:scale-95 text-white">
                TRY AGAIN
            </button>
        </div>
    </div>

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <script>
        // --- GAME VARIABLES & CONFIG ---
        const LANES = [-4, -2, 0, 2, 4];
        let currentLane = 2;
        
        let scene, camera, renderer;
        let roadsterGroup, roadsterBody;
        let boosterFlames = [];
        let isBoosting = false;
        let obstacles = [];
        let roadPlanes = [];
        let laneLines = [];
        let cityBuildings = [];
        let roadsideTrees = [];
        
        let targetX = LANES[currentLane];
        let carY = 0.4;
        let jumpVelocity = 0;
        const GRAVITY = -28;
        const JUMP_FORCE = 10;
        let isJumping = false;

        let isPlaying = false;
        let startTime = 0;
        let elapsedTime = 0;
        let lives = 1; // 목숨 1개
        let baseSpeed = 0.42;
        let currentSpeed = baseSpeed;
        let spawnInterval = 850;
        let lastSpawnTime = 0;
        let invulnerable = 0;

        // Elements
        const hud = document.getElementById('hud');
        const speedometerHud = document.getElementById('speedometer-hud');
        const speedText = document.getElementById('speed-text');
        const touchControls = document.getElementById('touch-controls');
        const modalContainer = document.getElementById('modal-container');
        const startScreen = document.getElementById('start-screen');
        const gameoverScreen = document.getElementById('gameover-screen');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const scoreText = document.getElementById('score-text');
        const finalScore = document.getElementById('final-score');
        const livesContainer = document.getElementById('lives-container');
        const damageOverlay = document.getElementById('damage-overlay');

        // --- THREE.JS INITIALIZATION (UNREAL ENGINE STYLE) ---
        function initThree() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a1128); // Deep unreal night sky tone
            scene.fog = new THREE.FogExp2(0x0a1128, 0.005);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3.5, -6);
            camera.lookAt(0, 1.5, 10);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            container.appendChild(renderer.domElement);

            // Unreal Style Lighting Setup
            const ambientLight = new THREE.AmbientLight(0x38bdf8, 0.6);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfffaed, 2.0);
            sunLight.position.set(20, 50, -20);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 150;
            const d = 20;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            scene.add(sunLight);

            // Colored point light for hyper-realistic neon reflections
            const neonBlueLight = new THREE.PointLight(0x00ffff, 2, 30);
            neonBlueLight.position.set(-8, 3, 10);
            scene.add(neonBlueLight);

            const neonPinkLight = new THREE.PointLight(0xff00ff, 2, 30);
            neonPinkLight.position.set(8, 3, 10);
            scene.add(neonPinkLight);

            createRoad();
            createCity();
            createTeslaRoadster();

            window.addEventListener('resize', onWindowResize);
        }

        function createRoad() {
            const roadGeometry = new THREE.PlaneGeometry(12, 300);
            const roadMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x111827, 
                roughness: 0.2, 
                metalness: 0.8 
            });

            for (let i = 0; i < 2; i++) {
                const road = new THREE.Mesh(roadGeometry, roadMaterial);
                road.rotation.x = -Math.PI / 2;
                road.position.z = i * 300;
                road.receiveShadow = true;
                scene.add(road);
                roadPlanes.push(road);
            }

            const lineGeometry = new THREE.PlaneGeometry(0.12, 8);
            const lineMaterial = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });

            [-3, -1, 1, 3].forEach(xPos => {
                for (let z = 0; z < 200; z += 16) {
                    const line = new THREE.Mesh(lineGeometry, lineMaterial);
                    line.rotation.x = -Math.PI / 2;
                    line.position.set(xPos, 0.01, z);
                    scene.add(line);
                    laneLines.push(line);
                }
            });
        }

        function createCity() {
            const buildingColors = [0x1e293b, 0x0f172a, 0x334155, 0x1e1b4b];
            const sideOffset = 18;
            
            for (let z = -50; z < 250; z += 18) {
                [-1, 1].forEach(side => {
                    const group = new THREE.Group();
                    const width = 8 + Math.random() * 6;
                    const height = 30 + Math.random() * 40;
                    const depth = 8 + Math.random() * 6;

                    const geo = new THREE.BoxGeometry(width, height, depth);
                    const mat = new THREE.MeshStandardMaterial({
                        color: buildingColors[Math.floor(Math.random() * buildingColors.length)],
                        roughness: 0.25,
                        metalness: 0.75
                    });
                    const building = new THREE.Mesh(geo, mat);
                    building.position.y = height / 2;
                    building.castShadow = true;
                    building.receiveShadow = true;
                    group.add(building);

                    // Unreal glowing window strips
                    const windowMat = new THREE.MeshBasicMaterial({ color: Math.random() > 0.5 ? 0x00f0ff : 0xff00aa });
                    const windowGeo = new THREE.BoxGeometry(width * 0.8, height * 0.7, depth * 1.02);
                    const windows = new THREE.Mesh(windowGeo, windowMat);
                    windows.position.y = height / 2;
                    group.add(windows);

                    const posX = side * (sideOffset + Math.random() * 6);
                    group.position.set(posX, 0, z);

                    scene.add(group);
                    cityBuildings.push(group);
                });
            }

            // High-Detail Roadside Trees
            const treeTrunkGeo = new THREE.CylinderGeometry(0.2, 0.35, 2.2, 8);
            const treeTrunkMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.9 });
            const treeLeavesGeo = new THREE.ConeGeometry(1.4, 3.5, 8);
            const treeLeavesMat = new THREE.MeshStandardMaterial({ color: 0x065f46, roughness: 0.7, metalness: 0.2 });

            for (let z = -40; z < 250; z += 12) {
                [-1, 1].forEach(side => {
                    const treeGroup = new THREE.Group();

                    const trunk = new THREE.Mesh(treeTrunkGeo, treeTrunkMat);
                    trunk.position.y = 1.1;
                    trunk.castShadow = true;
                    treeGroup.add(trunk);

                    const leaves = new THREE.Mesh(treeLeavesGeo, treeLeavesMat);
                    leaves.position.y = 3.2;
                    leaves.castShadow = true;
                    treeGroup.add(leaves);

                    const treeX = side * 7.5;
                    treeGroup.position.set(treeX, 0, z);

                    scene.add(treeGroup);
                    roadsideTrees.push(treeGroup);
                });
            }
        }

        function createTeslaRoadster() {
            roadsterGroup = new THREE.Group();

            // Unreal Ultra Glossy Red Paint
            const bodyGeo = new THREE.BoxGeometry(1.6, 0.5, 3.4);
            const bodyMat = new THREE.MeshStandardMaterial({ 
                color: 0xff0033, 
                metalness: 0.95,
                roughness: 0.05,
                clearcoat: 1.0,
                clearcoatRoughness: 0.1
            });
            roadsterBody = new THREE.Mesh(bodyGeo, bodyMat);
            roadsterBody.position.y = 0.4;
            roadsterBody.castShadow = true;
            roadsterGroup.add(roadsterBody);

            const cabinGeo = new THREE.BoxGeometry(1.3, 0.4, 1.6);
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x020617, metalness: 0.9, roughness: 0.05, transparent: true, opacity: 0.92 });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.set(0, 0.7, -0.2);
            roadsterGroup.add(cabin);

            // Headlights & Taillights
            const lightMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            const leftLight = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.1, 0.1), lightMat);
            leftLight.position.set(-0.6, 0.45, 1.66);
            roadsterGroup.add(leftLight);
            const rightLight = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.1, 0.1), lightMat);
            rightLight.position.set(0.6, 0.45, 1.66);
            roadsterGroup.add(rightLight);

            // Booster Flame Mesh
            const flameGeo = new THREE.ConeGeometry(0.22, 1.3, 8);
            flameGeo.rotateX(-Math.PI / 2);
            const flameMatOuter = new THREE.MeshBasicMaterial({ color: 0xff4500, transparent: true, opacity: 0.85 });
            const flameMatInner = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.95 });

            [-0.4, 0.4].forEach(xOffset => {
                const outerFlame = new THREE.Mesh(flameGeo, flameMatOuter);
                outerFlame.position.set(xOffset, 0.38, -2.2);
                outerFlame.visible = false;
                const innerFlame = new THREE.Mesh(flameGeo, flameMatInner);
                innerFlame.scale.set(0.5, 0.7, 0.5);
                innerFlame.position.set(xOffset, 0.38, -2.0);
                innerFlame.visible = false;
                roadsterGroup.add(outerFlame);
                roadsterGroup.add(innerFlame);
                boosterFlames.push(outerFlame, innerFlame);
            });

            // Wheels
            const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.25, 16);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.4, metalness: 0.5 });
            [[-0.8, 0.35, 1], [0.8, 0.35, 1], [-0.8, 0.35, -1], [0.8, 0.35, -1]].forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(...pos);
                wheel.castShadow = true;
                roadsterGroup.add(wheel);
            });

            roadsterGroup.position.set(LANES[currentLane], carY, 0);
            scene.add(roadsterGroup);
        }

        function spawnObstacle() {
            const laneX = LANES[Math.floor(Math.random() * LANES.length)];
            const rand = Math.random();
            const group = new THREE.Group();

            if (rand < 0.4) {
                // Oncoming Ferrari (Unreal Red Finish)
                const bodyGeo = new THREE.BoxGeometry(1.6, 0.42, 3.2);
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0xdc2626, metalness: 0.9, roughness: 0.1 });
                const mesh = new THREE.Mesh(bodyGeo, bodyMat);
                mesh.position.y = 0.35;
                mesh.castShadow = true;
                group.add(mesh);

                const cabinGeo = new THREE.BoxGeometry(1.25, 0.35, 1.4);
                const cabinMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.9 });
                const cabin = new THREE.Mesh(cabinGeo, cabinMat);
                cabin.position.set(0, 0.65, -0.1);
                group.add(cabin);

                group.userData = { height: 0.8, type: 'oncomingSpeed', selfSpeed: 0.24 };
            } else if (rand < 0.7) {
                // Tall Obstacle
                const geo = new THREE.BoxGeometry(1.5, 2.2, 3);
                const mat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.2, metalness: 0.8 });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.y = 1.1;
                mesh.castShadow = true;
                group.add(mesh);
                group.userData = { height: 2.2, type: 'tall', selfSpeed: 0 };
            } else {
                // Low Jump Barrier
                const geo = new THREE.BoxGeometry(1.6, 0.7, 1);
                const mat = new THREE.MeshStandardMaterial({ color: 0xea580c, roughness: 0.3, metalness: 0.6 });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.y = 0.35;
                mesh.castShadow = true;
                group.add(mesh);
                group.userData = { height: 0.7, type: 'low', selfSpeed: 0 };
            }

            group.position.set(laneX, 0, 90);
            scene.add(group);
            obstacles.push(group);
        }

        function setupInputs() {
            window.addEventListener('keydown', (e) => {
                if (!isPlaying) return;

                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                    moveLane(1); // 왼쪽 방향키 -> 오른쪽 차선 이동
                } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                    moveLane(-1); // 오른쪽 방향키 -> 왼쪽 차선 이동
                } else if ((e.key === ' ' || e.key === 'Spacebar') && !isJumping) {
                    jump();
                } else if (e.key === 'Shift') {
                    isBoosting = true;
                }
            });

            window.addEventListener('keyup', (e) => {
                if (e.key === 'Shift') isBoosting = false;
            });

            const btnLeft = document.getElementById('btn-left');
            const btnRight = document.getElementById('btn-right');
            const btnJump = document.getElementById('btn-jump');
            const btnBoost = document.getElementById('btn-boost');

            if (btnLeft) {
                btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); moveLane(1); });
                btnLeft.addEventListener('click', () => moveLane(1));
            }
            if (btnRight) {
                btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); moveLane(-1); });
                btnRight.addEventListener('click', () => moveLane(-1));
            }
            if (btnJump) {
                btnJump.addEventListener('touchstart', (e) => { e.preventDefault(); if (!isJumping) jump(); });
                btnJump.addEventListener('click', () => { if (!isJumping) jump(); });
            }
            if (btnBoost) {
                btnBoost.addEventListener('touchstart', (e) => { e.preventDefault(); isBoosting = true; });
                btnBoost.addEventListener('touchend', (e) => { e.preventDefault(); isBoosting = false; });
                btnBoost.addEventListener('mousedown', () => isBoosting = true);
                btnBoost.addEventListener('mouseup', () => isBoosting = false);
            }
        }

        function moveLane(direction) {
            currentLane = Math.max(0, Math.min(LANES.length - 1, currentLane + direction));
            targetX = LANES[currentLane];
        }

        function jump() {
            isJumping = true;
            jumpVelocity = JUMP_FORCE;
        }

        function animate(timestamp) {
            requestAnimationFrame(animate);

            if (isPlaying) {
                elapsedTime = (timestamp - startTime) / 1000;
                scoreText.textContent = `${elapsedTime.toFixed(1)}s`;

                const boostMultiplier = isBoosting ? 1.6 : 1.0;
                currentSpeed = (baseSpeed + (elapsedTime * 0.012)) * boostMultiplier;

                const displaySpeed = Math.floor(120 + (currentSpeed * 140));
                speedText.textContent = displaySpeed;

                boosterFlames.forEach((flame, idx) => {
                    flame.visible = isBoosting;
                    if (isBoosting) {
                        flame.scale.z = 1 + Math.sin(timestamp * 0.05 + idx) * 0.3;
                    }
                });

                const targetFov = isBoosting ? 70 : 60;
                camera.fov += (targetFov - camera.fov) * 0.1;
                camera.updateProjectionMatrix();

                roadsterGroup.position.x += (targetX - roadsterGroup.position.x) * 0.3;
                const tilt = (targetX - roadsterGroup.position.x) * 0.15;
                roadsterGroup.rotation.z = tilt;
                roadsterGroup.rotation.y = tilt * 0.5;

                if (isJumping) {
                    roadsterGroup.position.y += jumpVelocity * 0.016;
                    jumpVelocity += GRAVITY * 0.016;

                    if (roadsterGroup.position.y <= carY) {
                        roadsterGroup.position.y = carY;
                        isJumping = false;
                        jumpVelocity = 0;
                    }
                }

                roadPlanes.forEach(road => {
                    road.position.z -= currentSpeed;
                    if (road.position.z <= -150) road.position.z += 600;
                });

                laneLines.forEach(line => {
                    line.position.z -= currentSpeed;
                    if (line.position.z <= -20) line.position.z += 200;
                });

                cityBuildings.forEach(building => {
                    building.position.z -= currentSpeed * 0.8;
                    if (building.position.z <= -60) building.position.z += 300;
                });

                roadsideTrees.forEach(tree => {
                    tree.position.z -= currentSpeed;
                    if (tree.position.z <= -30) tree.position.z += 280;
                });

                if (timestamp - lastSpawnTime > Math.max(350, spawnInterval - elapsedTime * 7)) {
                    spawnObstacle();
                    lastSpawnTime = timestamp;
                }

                if (invulnerable > 0) invulnerable--;

                for (let i = obstacles.length - 1; i >= 0; i--) {
                    const obs = obstacles[i];
                    obs.position.z -= (currentSpeed + (obs.userData.selfSpeed || 0));

                    const dz = Math.abs(obs.position.z - roadsterGroup.position.z);
                    const dx = Math.abs(obs.position.x - roadsterGroup.position.x);
                    const obsHeight = obs.userData.height || 1;

                    if (dz < 1.8 && dx < 1.2 && roadsterGroup.position.y < (obsHeight + 0.2)) {
                        if (invulnerable === 0) {
                            takeDamage();
                            invulnerable = 60;
                        }
                    }

                    if (obs.position.z < -10) {
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                    }
                }
            }

            renderer.render(scene, camera);
        }

        function takeDamage() {
            lives--;
            updateLivesUI();

            damageOverlay.classList.add('hit-flash');
            setTimeout(() => damageOverlay.classList.remove('hit-flash'), 400);

            if (lives <= 0) endGame();
        }

        function updateLivesUI() {
            const hearts = livesContainer.children;
            if (hearts.length > 0) {
                hearts[0].style.opacity = lives > 0 ? '1' : '0.2';
            }
        }

        function startGame() {
            lives = 1;
            isBoosting = false;
            updateLivesUI();
            elapsedTime = 0;
            currentLane = 2;
            targetX = LANES[currentLane];
            roadsterGroup.position.set(targetX, carY, 0);
            
            obstacles.forEach(obs => scene.remove(obs));
            obstacles = [];

            modalContainer.classList.add('hidden');
            startScreen.classList.add('hidden');
            gameoverScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            speedometerHud.classList.remove('hidden');
            touchControls.classList.remove('hidden');

            startTime = performance.now();
            isPlaying = true;
        }

        function endGame() {
            isPlaying = false;
            finalScore.textContent = `${elapsedTime.toFixed(2)}초`;

            modalContainer.classList.remove('hidden');
            gameoverScreen.classList.remove('hidden');
            speedometerHud.classList.add('hidden');
            touchControls.classList.add('hidden');
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = () => {
            initThree();
            setupInputs();

            startBtn.addEventListener('click', startGame);
            restartBtn.addEventListener('click', startGame);

            requestAnimationFrame(animate);
        };
    </script>
</body>
</html>
